{% extends "pos/base.html" %}

{% block title %}Vente{% endblock %}

{% block script %}
<script>
    let caisse;
    var detail_encaissement = [
        {
            coupure: 5,
            qte: 0
        },
        {
            coupure: 10,
            qte: 0,
        },
        {
            coupure: 25,
            qte: 0,
        },
        {
            coupure: 50,
            qte: 0,
        },
        {
            coupure: 100,
            qte: 0,
        },
        {
            coupure: 200,
            qte: 0,
        },
        {
            coupure: 250,
            qte: 0,
        },
        {
            coupure: 500,
            qte: 0,
        },
        {
            coupure: 1000,
            qte: 0,
        },
        {
            coupure: 2000,
            qte: 0,
        },
        {
            coupure: 5000,
            qte: 0,
        },
        {
            coupure: 10000,
            qte: 0,
        },
    ];
    
    function reinitialiser_tableau_especes() {
        for (let index = 0; index < detail_encaissement.length; index++) {
            detail_encaissement[index].qte = 0;

            $('#' + detail_encaissement[index].coupure + '_qte').html(0);
        }
    }


    function mod_detail_encaissement(coupure, aug){
        mtt_encaissement = 0;

        id = coupure+'_qte';
        qte = Number($('#'+id).html());
        if(aug){
            n_qte = qte + 1;
            for (let index = 0; index < detail_encaissement.length; index++) {
                const element = detail_encaissement[index];
                if(element.coupure == coupure){
                    detail_encaissement[index].qte++;
                }

                mtt_encaissement = mtt_encaissement + detail_encaissement[index].qte * detail_encaissement[index].coupure;
            }
            $('#'+id).html(n_qte);
            $('#encaissement_input_id').val(mtt_encaissement);
            
        } else {
            if(qte > 0){
                n_qte = qte - 1;
                for (let index = 0; index < detail_encaissement.length; index++) {
                    const element = detail_encaissement[index];
                    if (element.coupure == coupure) {
                        detail_encaissement[index].qte--;
                    }

                    mtt_encaissement = mtt_encaissement + detail_encaissement[index].qte * detail_encaissement[index].coupure;
                }
                $('#' + id).html(n_qte);
                $('#encaissement_input_id').val(mtt_encaissement);
            }
        }

        if (mtt_encaissement) {
            $('#enregistrer').prop('disabled', false);
        } else {
            $('#enregistrer').prop('disabled', true);
        }

    }

    function update_montant_caisse() {
        montant_caisse = 0;
        caisse.forEach(element => {
            montant_caisse += Number(element.coupure) * Number(element.qte);
        });
        
        $('#montant_caisse').html(montant_caisse);
    }


    $(document).ready(function () {
        $.ajax({
            type: 'GET',
            url: "{% url 'pos:vente' user.id %}",
            success: function (response) {
                caisse = response.caisse;
                console.log(caisse);
                update_montant_caisse();
            },
            error: function (response) {
                swal("Erreur!", "Une erreur s'est produite. Contactez le +22665136188 si l'erreur persiste!", "error");
            },
        });
        $('#encaissement_input_id').val(0);
        

        $('#reinitialiser-button').on('click', function (e) {
            e.preventDefault();
            reinitialiser_tableau_especes();
            
            $('#monnaie_id').replaceWith(`<input type="text" style="font-weight:bold" readonly class="form-control-plaintext" id="monnaie_id" value="MONNAIE: ` + 0 + ` FCFA">`);
            $('#encaissement_input_id').val(0);

        });

        $('#enregistrer').on('click', function (e) {
            e.preventDefault();

            $.ajax({
                type: 'POST',
                url: "{% url 'pos:depot_petite_monnaie' user.id %}",
                data: {
                    csrfmiddlewaretoken: $('input[name=csrfmiddlewaretoken]').val(),
                    detail_encaissement: JSON.stringify(detail_encaissement)
                },
                success: function (response) {
                    swal("Opération réussie!", "Dépot enregistré!", "success");
                    caisse = response.caisse;
                    console.log(caisse);

                    update_montant_caisse();
                    $('#encaissement_input_id').val(0);

                    reinitialiser_tableau_especes();
                },
                error: function (response) {
                    swal("Erreur!", "Une erreur s'est produite. Contactez le +22665136188 si l'erreur persiste!", "error");
                }
            });
        });

    });
</script>
{% endblock %}

{% block main %}

    <div class="row" style="margin-bottom: 1%;">
        <div class="col-12">
            <a class="btn btn-primary float-right" href="#">Caisse : <span id="montant_caisse"></span> FCFA</a>
        </div>
    </div>
    <div class="row">
        
        <div class="col-12">

            <div class="row">
                <div class="col-12">
                    <div class="row" style="margin-top: 10px;">
                        <div class="col-8">
                            <form class="form-inline">
                                <div class="form-group mx-sm-3 mb-2">
                                    <input type="number" class="form-control" id="encaissement_input_id" readonly
                                        placeholder="Encaissement" value="0">
                                </div>
                                
                                <div class="form-group mb-2">
                                    <button class="btn btn-primary float-right" id="reinitialiser-button">Réinitiliser</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <table id="" class="table table-striped table-bordered ">
                        <tr>
                            <td>5 X <span id="5_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(5, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(5, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                            <td>10 X <span id="10_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(10, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(10, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                            <td>25 X <span id="25_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(25, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(25, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>50 X <span id="50_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(50, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(50, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                            <td>100 X <span id="100_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(100, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(100, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                            <td>200 X <span id="200_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(200, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(200, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>500 X <span id="500_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(500, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(500, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                            <td>1000 X <span id="1000_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(1000, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(1000, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                            <td>250 X <span id="250_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(250, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(250, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>5000 X <span id="5000_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(5000, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(5000, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                            <td>10000 X <span id="10000_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(10000, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(10000, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                            <td>2000 X <span id="2000_qte">0</span>
                                <div class="btn-group mr-2 float-right" role="group" aria-label="First group">
                                    <button onclick="mod_detail_encaissement(2000, true)" type="button" class="btn btn-primary">+</button>
                                    <button onclick="mod_detail_encaissement(2000, false)" type="button" class="btn btn-primary">-</button>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <div class="row" style="margin-bottom: 1%;">
        <div class="col-12">
            <button class="btn btn-primary float-right" id="enregistrer" disabled>Enregistrer</button>
        </div>
    </div>
</div>
{% endblock %}
